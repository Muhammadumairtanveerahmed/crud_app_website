apiVersion: apps/v1
kind: Deployment
metadata:
  name: crud-app
spec:
  replicas: 1
  selector:
    matchLabels: { app: crud-app }
  template:
    metadata:
      labels: { app: crud-app }
    spec:
      containers:
        - name: crud-app
          image: crud-app:k8s
          imagePullPolicy: Never
          env:
            - name: DB_HOST
              value: "db"
            - name: DB_USER
              value: "crud_user"
            - name: DB_PASS
              value: "crud_pass"
            - name: DB_NAME
              value: "crud_app"
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: crud-app-service
spec:
  type: NodePort
  selector: { app: crud-app }
  ports:
    - port: 80
      targetPort: 80
